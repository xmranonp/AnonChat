<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AnonChat</title>
<style>
  @import url('about:blank');
  @font-face { font-family: 'Inter'; font-weight: 400; src: url('fonts/Inter-Regular.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('fonts/Inter-SemiBold.woff') format('woff'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('fonts/Inter-Bold.woff') format('woff'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('fonts/IBMPlexMono-Regular.woff') format('woff'); }
  :root {
    --ink: #1A1A1A; --panel: #202020; --border: #333333;
    --text: #ECECEC; --dim: #A8A8A8; --muted: #6E6E6E;
    --signal: #1BC1EF; --signal-rgb: 27,193,239;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; user-select: none; overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px;
  }

  .logo { width: 44px; height: 44px; display: block; margin-bottom: -6px; }
  .wordmark { font-size: 26px; font-weight: 700; letter-spacing: 0.005em; }
  .wordmark b { color: inherit; font-weight: inherit; }

  .relay { display: flex; align-items: center; gap: 14px; }
  .relay .node {
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--panel); border: 1.5px solid var(--border); position: relative;
  }
  .relay .node::after {
    content: ''; position: absolute; inset: -1.5px; border-radius: 50%;
    background: var(--signal); opacity: 0;
  }
  .relay .wire { width: 34px; height: 1.5px; background: var(--border); position: relative; overflow: hidden; }
  .relay .wire::after {
    content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--signal), transparent);
    animation: flow 2.1s linear infinite;
  }
  .relay .wire.w2::after { animation-delay: 1.05s; }
  .relay .node.n1::after { animation: lit 2.1s infinite 0s; }
  .relay .node.n2::after { animation: lit 2.1s infinite 0.7s; }
  .relay .node.n3::after { animation: lit 2.1s infinite 1.4s; }
  @keyframes flow { to { left: 140%; } }
  @keyframes lit {
    0%,100% { opacity: 0; box-shadow: 0 0 0 0 rgba(var(--signal-rgb),0); }
    18% { opacity: 1; box-shadow: 0 0 12px 2px rgba(var(--signal-rgb),0.6); }
    36% { opacity: 0; }
  }

  .status {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    color: var(--dim); letter-spacing: 0.02em; min-height: 16px; text-align: center;
  }
  .bar { width: 240px; height: 3px; background: var(--panel); border-radius: 2px; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--signal), #6ADBF8);
    border-radius: 2px; transition: width 0.5s ease;
  }
  .hint { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }
  .hint.long { text-align: center; padding: 0 32px; line-height: 1.6; font-size: 11px; color: var(--text, #ddd); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* Passphrase steps (only when this computer's data is protected by a passphrase, or has no keyring) */
  body.keymode .relay, body.keymode .status, body.keymode .bar, body.keymode .hint { display: none; }
  .key { display: none; width: 340px; flex-direction: column; align-items: stretch; gap: 10px; user-select: text; }
  body.keymode .key { display: flex; }
  .key h1 { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 2px; }
  .key p { font-size: 12.5px; line-height: 1.5; color: var(--dim); text-align: center; }
  .key .fld { position: relative; }
  .key input { width: 100%; padding: 10px 56px 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font: 400 14px 'Inter', sans-serif; outline: none; }
  .key input:focus { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(var(--signal-rgb), 0.22); }
  .key .show { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted);
    font: 400 12px 'Inter', sans-serif; cursor: pointer; padding: 4px 6px; }
  .key .go { padding: 10px; border-radius: 8px; border: 1px solid var(--signal); background: var(--signal); color: #04141C;
    font: 600 14px 'Inter', sans-serif; cursor: pointer; }
  .key .go:disabled { opacity: 0.55; cursor: default; }
  .key .err { min-height: 16px; font-size: 12px; color: #E86A6A; text-align: center; }
  .key .links { display: flex; justify-content: center; gap: 16px; }
  .key .links button { background: none; border: none; color: var(--muted); font: 400 12px 'Inter', sans-serif; cursor: pointer; text-decoration: underline; }
  .key .links button:hover { color: var(--text); }
  .key .danger { padding: 9px; border-radius: 8px; border: 1px solid #E86A6A; background: transparent; color: #E86A6A;
    font: 600 13px 'Inter', sans-serif; cursor: pointer; }
  .key .danger:disabled { opacity: 0.5; cursor: default; }
</style>

<body>

    <span class="node n1"></span>
    <span class="wire w1"></span>
    <span class="node n2"></span>
    <span class="wire w2"></span>
    <span class="node n3"></span>
  </div>
  <div class="status" id="status">starting node…</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="hint" id="hint">building circuits over the Anyone network</div>
  <form class="key" id="key" autocomplete="off"></form>

  const statusEl = document.getElementById('status');
  const barEl    = document.getElementById('bar');
  const hintEl   = document.getElementById('hint');

  on('bootstrap-progress', (pct) => {
    pct = Number(pct) || 0;
    barEl.style.width = pct + '%';
    statusEl.textContent = `bootstrapping… ${pct}%`;
    if (pct >= 100) statusEl.textContent = S.publishing;
  });

  on('backend-log', (line) => {
    line = String(line || '');
    if (/error|fail/i.test(line)) hintEl.textContent = line.slice(0, 60);
  });

  on('backend-ready', () => {
    barEl.style.width = '100%';
    statusEl.textContent = S.connected;
  });

  on('backend-timeout', () => {
    statusEl.textContent = S.slow;
    hintEl.textContent = S.slowHint;
  });

      damaged: 'Plik z kluczem do danych jest uszkodzony. Niczego nie zmieniono.', startOver: 'Zacznij od nowa…' },
    hi: { connected: "कनेक्ट हो गया", publishing: "आपका पता प्रकाशित हो रहा है…", slow: "उम्मीद से ज़्यादा समय लग रहा है…", slowHint: "नेटवर्क धीमा हो सकता है — कोशिश जारी है", startFailed: "शुरू नहीं हो सका", portBusy: "कोई दूसरा प्रोग्राम वह पोर्ट (47822) इस्तेमाल कर रहा है जिसकी AnonChat को ज़रूरत है। उसे बंद करें और AnonChat फिर से शुरू करें।", enter: 'अपना पासफ़्रेज़ दर्ज करें', unlock: 'अनलॉक करें', unlocking: 'अनलॉक हो रहा है…', enterNote: 'अनलॉक करने के बाद Anyone नेटवर्क से जुड़ना शुरू होता है।',
      choose: 'पासफ़्रेज़ चुनें', chooseNote: 'इस सिस्टम में एन्क्रिप्शन कुंजी रखने के लिए कीरिंग नहीं है, इसलिए AnonChat आपके डेटा को पासफ़्रेज़ से सुरक्षित रखता है।',
      again: 'फिर से टाइप करें', cont: 'जारी रखें', show: 'दिखाएँ', hide: 'छिपाएँ', quit: 'बंद करें', forgot: 'भूल गए?',
      wrong: 'गलत पासफ़्रेज़', empty: 'अपना पासफ़्रेज़ टाइप करें', short: 'कम से कम {n} अक्षर', mismatch: 'दोनों मेल नहीं खाते',
      forgotTitle: 'पासफ़्रेज़ भूल गए?', forgotNote: 'इसे कोई वापस नहीं ला सकता। आप इस कंप्यूटर पर सब कुछ मिटाकर नई पहचान के साथ फिर से शुरू कर सकते हैं। आपके संपर्कों को आपका नया पता चाहिए होगा।',
      word: 'मिटाएँ', typeWord: 'पुष्टि के लिए टाइप करें: {w}', erase: 'मिटाएँ और बंद करें', back: 'वापस',
      errTitle: 'आपका डेटा अनलॉक नहीं हो सका', vault: 'सिस्टम कीरिंग ने AnonChat की कुंजी नहीं लौटाई। अगर आपने हाल ही में लॉगिन पासवर्ड या कीरिंग बदली है, तो कीरिंग अनलॉक करके AnonChat फिर से खोलें।',
      novault: 'आपका डेटा सिस्टम कीरिंग से सुरक्षित है, जो अभी उपलब्ध नहीं है। सामान्य तरीके से लॉग इन करके AnonChat फिर से खोलें।',
      damaged: 'आपके डेटा की कुंजी वाली फ़ाइल खराब हो गई है। कुछ भी नहीं बदला गया।', startOver: 'फिर से शुरू करें…' },
  };
  // The language chosen in the app (passed by the desktop app), or the system's before it has been chosen.
  const LANG = ((new URLSearchParams(location.search).get('lang') || navigator.language || 'en').slice(0, 2).toLowerCase());
  const S = T[LANG] || T.en;
  const tr = (k, v = {}) => (S[k] || T.en[k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
  const keyEl = document.getElementById('key');
  const mk = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
  function field(id, label) {
    const input = mk('input', { type: 'password', id, placeholder: label, spellcheck: false });
    input.setAttribute('aria-label', label);
    const show = mk('button', { type: 'button', className: 'show', textContent: tr('show') });
    show.onclick = () => { const on = input.type === 'password'; input.type = on ? 'text' : 'password'; show.textContent = tr(on ? 'hide' : 'show'); input.focus(); };
    return [mk('div', { className: 'fld' }, input, show), input];
  }
  function eraseStep(back, title) {
    keyEl.replaceChildren();
    const word = tr('word');
    const input = mk('input', { type: 'text', spellcheck: false });
    input.setAttribute('aria-label', tr('typeWord', { w: word }));
    const go = mk('button', { type: 'button', className: 'danger', textContent: tr('erase'), disabled: true });
    input.oninput = () => { go.disabled = input.value.trim().toLocaleUpperCase() !== word.toLocaleUpperCase(); };
    go.onclick = () => { go.disabled = true; window.splash.submit({ action: 'erase' }); };
    const b = mk('button', { type: 'button', textContent: tr('back') }); b.onclick = back;
    keyEl.append(mk('h1', { textContent: title || tr('forgotTitle') }), mk('p', { textContent: tr('forgotNote') }),
      mk('p', { textContent: tr('typeWord', { w: word }) }), input, go, mk('div', { className: 'links' }, b));
    setTimeout(() => input.focus(), 30);
  }
  let lastStep = null;
  function render(step) {
    lastStep = step;
    document.body.classList.add('keymode');
    keyEl.replaceChildren();
    const quit = mk('button', { type: 'button', textContent: tr('quit') }); quit.onclick = () => window.splash.submit({ action: 'quit' });
    const err = mk('div', { className: 'err', role: 'alert', textContent: step.error ? tr(step.error, { n: step.min || 12 }) : '' });
    if (step.mode === 'error') {
      const over = mk('button', { type: 'button', textContent: tr('startOver') }); over.onclick = () => eraseStep(() => render(lastStep), tr('startOver').replace('…', '?'));
      keyEl.append(mk('h1', { textContent: tr('errTitle') }), mk('p', { textContent: tr(step.reason) }), mk('div', { className: 'links' }, quit, over));
      return;
    }
    if (step.mode === 'enter') {
      const [box, input] = field('pass', tr('enter'));
      const go = mk('button', { type: 'submit', className: 'go', textContent: tr('unlock') });
      const forgot = mk('button', { type: 'button', textContent: tr('forgot') }); forgot.onclick = () => eraseStep(() => render(lastStep));
      keyEl.onsubmit = (e) => { e.preventDefault(); go.disabled = true; window.splash.submit({ pass: input.value }); input.value = ''; };
      keyEl.append(mk('h1', { textContent: tr('enter') }), box, go, err, mk('p', { textContent: tr('enterNote') }), mk('div', { className: 'links' }, quit, forgot));
      setTimeout(() => input.focus(), 30);
      return;
    }
    const [box1, in1] = field('pass', tr('choose'));
    const [box2, in2] = field('pass2', tr('again'));
    const go = mk('button', { type: 'submit', className: 'go', textContent: tr('cont') });
    keyEl.onsubmit = (e) => { e.preventDefault(); go.disabled = true; window.splash.submit({ pass: in1.value, confirm: in2.value }); };
    keyEl.append(mk('h1', { textContent: tr('choose') }), mk('p', { textContent: tr('chooseNote') }), box1, box2, go, err, mk('div', { className: 'links' }, quit));
    setTimeout(() => in1.focus(), 30);
  }
  on('key-prompt', render);
  on('key-busy', () => { const g = keyEl.querySelector('.go'); if (g) { g.disabled = true; g.textContent = tr('unlocking'); } });
  on('key-done', () => { document.body.classList.remove('keymode'); keyEl.replaceChildren(); });

  on('backend-error', (msg) => {
    statusEl.textContent = S.startFailed;
    // exit 5: the port the address uses is held by another program (server.js listenPublic).
    hintEl.classList.toggle('long', msg === 'exit 5');
    hintEl.textContent = msg === 'exit 5' ? S.portBusy : String(msg || '').slice(0, 60);
  });
</script>
</body>
</html>
